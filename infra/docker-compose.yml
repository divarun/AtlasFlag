version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlasflag-postgres
    environment:
      POSTGRES_DB: atlasflag
      POSTGRES_USER: atlasflag
      POSTGRES_PASSWORD: atlasflag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasflag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
