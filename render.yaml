services:
  - type: web
    name: atlasflag-backend
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false         # set in Render dashboard
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure random value
      - key: CORS_ALLOWED_ORIGINS
        sync: false         # optional — only needed if SDK clients call from a different origin
