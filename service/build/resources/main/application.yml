spring:
  application:
    name: atlas-flag-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlasflag}
    username: ${DATABASE_USERNAME:atlasflag}
    password: ${DATABASE_PASSWORD:atlasflag}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        sslmode: ${DB_SSL_MODE:prefer}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine

server:
  port: ${PORT:8080}

atlasflag:
  jwt:
    secret: ${JWT_SECRET:atlasflag-secret-key-change-in-production-min-256-bits}
    expiration: 86400000
  cache:
    ttl: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.atlasflag: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
